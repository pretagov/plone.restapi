name: Tests
on: [push,pull_request]
jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # This fork is only deployed on the nsw-dds stack (pretagov/plone6-nsw-dds),
        # so test against the Plone and Python versions it runs. The upstream
        # buildout matrix (Plone 5.2, Python 3.7-3.11) no longer builds.
        include:
          - python-version: '3.12'
            plone-version: '6.0.15'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Plone constraints without plone.restapi
        run: |
          curl -sSfL https://dist.plone.org/release/${{ matrix.plone-version }}/constraints.txt \
            | grep -v -i '^plone\.restapi==' > constraints-ci.txt

      - name: pip install
        run: pip install -c constraints-ci.txt Plone -e ".[test]" zope.testrunner

      - name: test
        run: zope-testrunner --path src --package plone.restapi --all
